it used in navbar, high-lighting text, highlighting button, change color, change css property,  -->

<!-- hover : psudo class, psuodo property  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    .btn {
        color: black;
        background-color: lightblue;
    }

    .btn:hover {
        color: green;
        background-color: yellow;
    }

    </style>
</head>
<body>
    <button class="btn"> Click here </button>
</body>
</html>
