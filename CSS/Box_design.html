<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1, .box2, .box3, .box4{
        height: 200px;
        width: 200px;
        border: 2px solid black;
        border-radius: 20px 20px 20px 20px;

        }
        .box2, .box4{
        height: 200px;
        width: 200px;
        border: 2px solid black;
        margin-left: 200px;
        margin-top: -200px;
        }
       
       

    </style>
</head>
<body>
    <div class="box1" style="border-radius: 0% 100%; background-color: blue;"></div>
    <div class="box2" style="border-radius: 100% 0%; background-color: lightblue;"></div>
    <div class="box3" style="border-radius: 100% 0%; background-color: lightblue;"></div>
    <div class="box4" style="border-radius: 0% 100%; background-color: blue;"></div>
    
    
</body>
</html>
