<!-- 1. x-offset : horizontal  (height)
2. y-offset: vertical (width)
3. blur or spread
4. color  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text shadow </title>
    <style> 
    h4 {
        text-shadow: 30px 20px 5px yellow, 20px 20px 5px red;
        text-align: center;
        font-size: 50px;
    }
    </style>
</head>
<body>
    <h4> Hello World </h4>
</body>
</html>
