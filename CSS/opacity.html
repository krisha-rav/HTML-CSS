<!-- opacity: work on visibility and hidden  -->
<!-- 0 - hidden 
1 - visibility -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    .box {
        opacity: 0.4;
        background-color: aqua;
        height: 200px;
        width: 200px;
    }
    </style>
</head>
<body>
    <div class="box"> Hello </div>

</body>
</html>
