<!-- Animation- animation can change the CSS automatically, we can move elements automatically -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 200px;
            width: 100%;
            background-color: blue;
            animation-name: ani;
            animation-duration: 5s;
            animation-delay: 3s;
            animation-iteration-count: 2;
            animation-play-state: running;
            animation-timing-function: ease;
            /* // ease : start flow, between fast, end slow */
            /* ease -in : start slow */
            /* ease-out: end slow */
            /* ease - in - out : start and end slow */
        }
        /* @keyframes ani {
            from {
               background-color: yellow;
               width: 0%;
            } 
            
            to {
               background-color: green;
               width: 100%
            }
        } */
          @keyframes ani {
        0% {
             background-color: yellow;
             width: 0%;
        }

        25% {
            background-color: orange;
            width: 25%;
        }

        50% {
            background-color: green;
            width: 50%;
        }

        75% {
            background-color: purple;
            width: 75%;
        }

        100% {
            background-color: pink;
            width: 100%;
        }
    }
        
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
