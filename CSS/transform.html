<!-- its also allow to mouse effect (hover, click, focus)
  write in the place of hover: click(changes on click)
                              focus(focuses or highlights the text or color) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.box {
    height: 200px;
    width: 200px;
    background-color: green;
}

.box:hover {
    /* transform: rotate(50deg); */
    /* transform: scale(1.3); */
    transform: translate(50px, 50px);
    /* transform: skew(50deg); */
}
    </style>
</head>
<body>
    <div class="box"> Good Morning </div>
</body>
</html>
